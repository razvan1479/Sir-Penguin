<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Licențe · iDeaL{% endblock %}</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e6e8ee; --muted: #8b93a7; --accent: #5865f2; --accent-2: #7983f5;
    --ok: #3ba55d; --warn: #faa61a; --bad: #ed4245;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent-2); }
  .wrap { max-width: 1150px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; }
  header h1 { font-size: 20px; margin: 0; }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 15px; margin: 0 0 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 24px; }
  form.inline { display: inline; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
                  border-radius: 8px; padding: 8px 10px; font: inherit; }
  input[type=number] { width: 90px; }
  button, .btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 14px;
                 font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { background: var(--accent-2); }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); padding: 5px 10px; font-weight: 500; }
  button.ghost:hover { background: var(--panel-2); }
  button.danger { background: transparent; border: 1px solid #5a2a2c; color: #f08a8c; padding: 5px 10px; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .table-wrap { overflow-x: auto; }
  code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: rgba(59,165,93,.15); color: #6fd38f; }
  .pill.warn { background: rgba(250,166,26,.15); color: #ffc15e; }
  .pill.bad { background: rgba(237,66,69,.15); color: #f58a8c; }
  .pill.idle { background: var(--panel-2); color: var(--muted); }
  .flash { background: rgba(88,101,242,.12); border: 1px solid rgba(88,101,242,.4); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
  .newkeys { background: rgba(59,165,93,.08); border: 1px solid rgba(59,165,93,.35); }
  .newkeys textarea { width: 100%; min-height: 90px; background: var(--panel-2); color: var(--text);
                      border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: ui-monospace, Consolas, monospace; }
  .tabs a { margin-right: 12px; color: var(--muted); text-decoration: none; }
  .tabs a.on { color: var(--text); font-weight: 600; }
  @media (max-width: 640px) { .stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
